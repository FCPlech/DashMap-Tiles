# Validates index + schemas on PRs. Map data itself is never in git,
# so this only checks the tracked metadata and script syntax.
name: Validate index and manifests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JSON syntax (index + schemas)
        run: |
          python3 -c "import json; json.load(open('tiles-index.json')); print('tiles-index.json ok')"
          python3 -c "import json; json.load(open('tiles-index.schema.json')); print('index schema ok')"
          python3 -c "import json; json.load(open('release-manifest.schema.json')); print('manifest schema ok')"

      - name: Script syntax
        run: |
          python3 -m py_compile scripts/publish_region.py scripts/verify_release.py scripts/build_index.py
          echo "scripts compile ok"

      - name: Index entries match <slug>-vYYYY.MM.DD convention
        run: |
          python3 - <<'EOF'
          import json, re, sys
          index = json.load(open('tiles-index.json'))
          assert index.get('schema') == 1, 'index schema must be 1'
          bad = [r for r in index.get('regions', [])
                 if not re.match(r'^.+-v\d{4}\.\d{2}\.\d{2}$', r.get('latest', ''))]
          if bad:
              print('FAIL: index entries not matching <slug>-vYYYY.MM.DD:', bad)
              sys.exit(1)
          print(f"index ok ({len(index.get('regions', []))} regions)")
          EOF

      - name: No map data tracked in git
        run: |
          tracked=$(git ls-files | grep -Ei '\.(zip|tar|sqlite|osm\.pbf|osm\.bz2|gph)$' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: map data files must never be committed (use Release assets):"
            echo "$tracked"
            exit 1
          fi
          echo "no tracked map data — ok"

      # End-to-end packaging check on synthetic data: publish a fake region,
      # verify it (including the split + deep paths), and confirm each zip
      # extracts to the exact on-device filenames.
      - name: Packaging round-trip (fake region)
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          reg = Path('/tmp/fake-input')
          reg.mkdir(parents=True, exist_ok=True)
          (reg / 'valhalla_tiles.tar').write_bytes(b'fake-tar' * 100)
          (reg / 'valhalla-manifest.json').write_text(json.dumps(
              {"region": "Brazil", "builtAtMs": 1750000000000}))
          (reg / 'streets.sqlite').write_bytes(b'fake-db')
          (reg / 'streets-manifest.json').write_text(json.dumps(
              {"region": "Brazil", "builtAtMs": 1750000000000}))
          EOF
          python3 scripts/publish_region.py \
            --slug brazil --display-name Brazil --tag brazil-v2026.09.16 \
            --valhalla-tar /tmp/fake-input/valhalla_tiles.tar \
            --valhalla-manifest /tmp/fake-input/valhalla-manifest.json \
            --streets-db /tmp/fake-input/streets.sqlite \
            --streets-manifest /tmp/fake-input/streets-manifest.json \
            --built-at-ms 1750000000000 \
            --source-pbf brazil-latest.osm.pbf \
            --source-url https://download.geofabrik.de/south-america/brazil-latest.osm.pbf \
            --out /tmp/fake-dist/single
          python3 scripts/verify_release.py --dir /tmp/fake-dist/single --deep
          python3 scripts/publish_region.py \
            --slug brazil --display-name Brazil --tag brazil-v2026.09.17 \
            --valhalla-tar /tmp/fake-input/valhalla_tiles.tar \
            --valhalla-manifest /tmp/fake-input/valhalla-manifest.json \
            --streets-db /tmp/fake-input/streets.sqlite \
            --streets-manifest /tmp/fake-input/streets-manifest.json \
            --built-at-ms 1750000000000 \
            --source-pbf brazil-latest.osm.pbf \
            --source-url https://download.geofabrik.de/south-america/brazil-latest.osm.pbf \
            --out /tmp/fake-dist/split --split-above 500 --part-size 500
          python3 scripts/verify_release.py --dir /tmp/fake-dist/split --deep
          python3 - <<'EOF'
          import tempfile, zipfile
          from pathlib import Path
          # single zip must extract to exact on-device names
          with tempfile.TemporaryDirectory() as t:
              with zipfile.ZipFile('/tmp/fake-dist/single/valhalla.zip') as z:
                  z.extractall(t)
              names = sorted(p.name for p in Path(t).iterdir())
              assert 'valhalla_tiles.tar' in names and 'manifest.json' in names, names
              print('valhalla.zip members ok:', names)
          with tempfile.TemporaryDirectory() as t:
              with zipfile.ZipFile('/tmp/fake-dist/single/streets.zip') as z:
                  z.extractall(t)
              names = sorted(p.name for p in Path(t).iterdir())
              assert names == ['manifest.json', 'streets-brazil.sqlite'], names
              print('streets.zip members ok:', names)
          EOF
